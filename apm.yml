name: apm-demo
version: 1.3.0
description: A barebones APM marketplace — example skill packages.

marketplace:
  owner:
    name: wietsche
    url: https://github.com/wietsche

  # Lockstep: every package carries the marketplace version, and one
  # repo tag releases them all. See README.md#versioning.
  versioning:
    strategy: tag_pattern

  build:
    tagPattern: "{name}-v{version}"

  outputs:
    claude: {}
    codex: {}

  packages:
    - name: hello
      description: Example greeting skill.
      category: examples
      source: ./packages/hello
      version: 1.1.0

    - name: echo
      description: Example skill that repeats input back.
      category: examples
      source: ./packages/echo
      version: 1.2.0

    - name: bye
      description: Example farewell skill.
      category: examples
      source: ./packages/bye
      version: 1.2.0

    - name: math-mcp
      description: Trivial MCP server providing basic math tools.
      category: examples
      source: ./packages/math-mcp
      version: 1.1.0
